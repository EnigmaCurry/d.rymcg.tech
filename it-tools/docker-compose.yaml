services:
  it-tools:
    environment:
      - TZ=${DEFAULT_TIMEZONE:-Etc/UTC}
    image: ${IT_TOOLS_IMAGE}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    labels: []
