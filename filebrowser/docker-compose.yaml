services:
  config:
    build:
      context: config
    security_opt:
      - no-new-privileges:true
    volumes:
      - config:/config
    labels:
      - "backup-volume.stop-during-backup=true"

  filebrowser:
    depends_on: ['config']
    build:
      context: filebrowser
      args:     
        IMAGE: ${FILEBROWSER_IMAGE}
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=1024
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    volumes:
      - config:/config
      - srv:/srv
      - database:/database
    environment:
      - AUTH_TYPE=${FILEBROWSER_AUTH_TYPE}
      - ADMIN_USERNAME=${FILEBROWSER_ADMIN_USERNAME}
      - ADMIN_PASSWORD=${FILEBROWSER_ADMIN_PASSWORD}
      - FILEBROWSER_UID
      - FILEBROWSER_GID
    ## The image's own healthcheck expects its s6 layout (/config/settings.json),
    ## which this entrypoint doesn't use:
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # All labels are defined in the template: docker-compose.instance.yaml
    labels: []

volumes:
  config:
  database:
  srv:
