x-invokeai: &invokeai
    image: ${INVOKEAI_IMAGE}:${INVOKEAI_IMAGE_TAG}
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - GPU_DRIVER=${INVOKEAI_GPU_DRIVER}
        - VERSION=${INVOKEAI_IMAGE_TAG}
    environment:
      - TZ=${DEFAULT_TIMEZONE:-Etc/UTC}
      - INVOKEAI_ROOT=/invokeai
      #- HF_HOME
    volumes:
      - data:/invokeai
      #- ${HF_HOME:-/.cache/huggingface}:${HF_HOME:-/invokeai/.cache/huggingface}
    tty: true
    stdin_open: true
    labels: []


services:
  invokeai-cuda:
    <<: *invokeai
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - cuda

  invokeai-cpu:
    <<: *invokeai
    profiles:
      - cpu

  invokeai-rocm:
    <<: *invokeai
    environment:
      - TZ=${DEFAULT_TIMEZONE:-Etc/UTC}
      - AMD_VISIBLE_DEVICES=all
      - RENDER_GROUP_ID=${INVOKEAI_RENDER_GROUP_ID}
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp=unconfined
      - no-new-privileges:true
    group_add:
      - video
      - render
    profiles:
      - rocm

volumes:
  data:
