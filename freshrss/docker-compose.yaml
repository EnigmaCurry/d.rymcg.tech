
services:
  freshrss:
    image: ${FRESHRSS_IMAGE}
    restart: unless-stopped
    volumes:
      - data:/var/www/FreshRSS/data
      - extensions:/var/www/FreshRSS/extensions
    environment:
      CRON_MIN: '*/20'
      TZ: ${FRESHRSS_TIMEZONE:-${DEFAULT_TIMEZONE:-Etc/UTC}}
    labels: []
volumes:
  data:
  extensions:
