
services:
  doh-server:
    environment:
      - TZ=${DEFAULT_TIMEZONE:-Etc/UTC}
    build:
      context: doh-server
      args:
        RUST_IMAGE: ${DOH_RUST_IMAGE:-rust:1.99.0-slim-bookworm}
        DOH_PROXY_VERSION: ${DOH_PROXY_VERSION:-0.10.0}
    command: doh-proxy -H ${DOH_TRAEFIK_HOST} -u ${DOH_UPSTREAM_DNS}:${DOH_UPSTREAM_DNS_PORT} -l 0.0.0.0:3000 -g ${DOH_PUBLIC_IP_ADDRESS}
    restart: unless-stopped
