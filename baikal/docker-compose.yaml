volumes:
  baikal_config:
  baikal_data:

services:
  baikal:
    build:
      context: image
      args:
        VERSION: ${BAIKAL_VERSION:-0.13.0}
        PHP_VERSION: ${BAIKAL_PHP_VERSION:-8.6}
        APPLY_HOME_ASSISTANT_FIX: ${BAIKAL_HOME_ASSISTANT_FIX:-true}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - FOWNER
      - NET_BIND_SERVICE
      # - FSETID
      # - MKNOD
      # - NET_RAW
      # - SETFCAP
      # - SETPCAP
      # - SYS_CHROOT
      # - KILL
      # - AUDIT_WRITE
    restart: unless-stopped
    environment:  
      TZ: ${DEFAULT_TIMEZONE:-Etc/UTC}
    labels: []
    volumes:
      - baikal_config:/var/www/baikal/config
      - baikal_data:/var/www/baikal/Specific
