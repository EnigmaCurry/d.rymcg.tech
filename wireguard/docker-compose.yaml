volumes:
  wireguard:

services:
  wireguard-config:
    build:
      context: wireguard-config
    network_mode: none
    environment:
      - WIREGUARD_VPN_CLIENT_INTERFACE_PRIVATE_KEY
      - WIREGUARD_VPN_CLIENT_INTERFACE_IPV4
      - WIREGUARD_VPN_CLIENT_INTERFACE_IPV6
      - WIREGUARD_VPN_CLIENT_INTERFACE_LISTEN_PORT
      - WIREGUARD_VPN_CLIENT_INTERFACE_PEER_DNS
      - WIREGUARD_VPN_CLIENT_PEER_PUBLIC_KEY
      - WIREGUARD_VPN_CLIENT_PEER_ALLOWED_IPS
      - WIREGUARD_VPN_CLIENT_PEER_ENDPOINT
    volumes:
      - wireguard:/config:z

  wireguard:
    depends_on: ['wireguard-config']
    image: ${WIREGUARD_IMAGE}
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
    volumes:
      - wireguard:/config:z
      - /lib/modules:/lib/modules
    restart: unless-stopped
    ## If wg-quick fails, the image logs "All tunnels are now down" and the
    ## container keeps running. /run/activeconfs is only written once every
    ## tunnel is up, so require it and each listed interface:
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/activeconfs && for i in $$(grep -o '[^/\"]*\\.conf' /run/activeconfs | sed 's/\\.conf$$//'); do wg show \"$$i\" >/dev/null 2>&1 || exit 1; done"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels: []
