#@ load("@ytt:data", "data")

#@ tls_proxy_enabled = data.values.layer_7_tls_proxy_enabled == "true"
#@ tls_proxy_routes = data.values.layer_7_tls_proxy_routes

#@yaml/text-templated-strings
#@ if tls_proxy_enabled and len(tls_proxy_routes):
tcp:
  #@ pp_routes = [r for r in tls_proxy_routes.split(",") if int(r.split(":")[3]) > 0]
  #@ if len(pp_routes):
  serversTransports:
    #@ for route in pp_routes:
    #@ domain, ip_address, port, proxy_protocol = route.split(":")
    #@ service = domain.replace(".","-")
    (@= service @)-proxy-transport:
      proxyProtocol:
        version: #@ int(proxy_protocol)
    #@ end
  #@ end
  services:
    #@ for route in tls_proxy_routes.split(","):
    #@ domain, ip_address, port, proxy_protocol = route.split(":")
    #@ service = domain.replace(".","-")
    (@= service @)-proxy:
      loadBalancer:
        #@ if int(proxy_protocol) > 0:
        serversTransport: (@= service @)-proxy-transport
        #@ end
        servers:
          - address: "(@= ip_address @):(@= port @)"
    #@ end
  routers:
    #@ for route in tls_proxy_routes.split(","):
    #@ domain = route.split(":")[0]
    #@ service = domain.replace(".","-")
    (@= service @)-proxy:
      entryPoints:
        - "websecure"
      rule: "HostSNI(`(@= domain @)`)"
      service: "(@= service @)-proxy"
      tls:
        passthrough: true
    #@ end
#@ end
