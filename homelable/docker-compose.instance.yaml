#! This is a ytt template file for docker-compose.override.yaml
#! References:
#!   https://carvel.dev/ytt
#!   https://docs.docker.com/compose/extends/#adding-and-overriding-configuration
#!   https://github.com/enigmacurry/d.rymcg.tech#overriding-docker-composeyaml-per-instance

#! ### Standard project vars:
#@ load("@ytt:data", "data")
#@ project = data.values.project
#@ instance = data.values.instance
#@ context = data.values.context
#@ traefik_host = data.values.traefik_host
#@ ip_sourcerange = data.values.ip_sourcerange
#@ enable_http_auth = len(data.values.http_auth.strip()) > 0
#@ http_auth = data.values.http_auth
#@ enable_oauth2 = data.values.oauth2 == "true"
#@ authorized_group = data.values.authorized_group
#@ enable_mtls_auth = data.values.enable_mtls_auth == "true"
#@ mtls_authorized_certs = data.values.mtls_authorized_certs
#@ enabled_middlewares = []
#@ homepage_labels_enable = data.values.homepage_labels_enable == "true"
#@ homepage_group_homelable = data.values.homepage_group_homelable
#@ homepage_name_homelable = data.values.homepage_name_homelable
#@ homepage_icon_homelable = data.values.homepage_icon_homelable
#@ homepage_description_homelable = data.values.homepage_description_homelable
#@ homepage_show_stats_homelable = data.values.homepage_show_stats_homelable
#@ homepage_widget_enable = data.values.homepage_widget_enable == "true"
#@ homepage_widget_api_key = data.values.homepage_widget_api_key
#@ mcp_enabled = "mcp" in data.values.profiles.split(",")

#@yaml/text-templated-strings
services:
  #! The backend owns the data volume; stop it while backup-volume runs:
  backend:
    labels:
      - "backup-volume.stop-during-backup=true"
    #! Blank the keys of disabled features so the running backend has
    #! them fully off (upstream treats an empty key as disabled). The
    #! values stay in the .env file and are re-applied on re-enable.
    #! Compose merges environment per key; this override file wins.
    #@ if not (homepage_widget_enable and len(homepage_widget_api_key)) or not mcp_enabled:
    environment:
      #@ if not (homepage_widget_enable and len(homepage_widget_api_key)):
      - HOMEPAGE_API_KEY=
      #@ end
      #@ if not mcp_enabled:
      - MCP_SERVICE_KEY=
      #@ end
    #@ end

  frontend:
    #@ service = "frontend"
    labels:
      #! Services must opt-in to be proxied by Traefik:
      - "traefik.enable=true"

      #! 'router' is the fully qualified key in traefik for this router/service: project + instance + service
      #@ router = "{}-{}-{}".format(project,instance,service)

      #! The host matching router rule:
      - "traefik.http.routers.(@= router @).rule=Host(`(@= traefik_host @)`)"
      - "traefik.http.routers.(@= router @).entrypoints=websecure"

      #@ enabled_middlewares.append("{}-ipallowlist".format(router))
      - "traefik.http.middlewares.(@= router @)-ipallowlist.ipallowlist.sourcerange=(@= ip_sourcerange @)"
      #@ if enable_http_auth:
      #@ enabled_middlewares.append("{}-basicauth".format(router))
      - "traefik.http.middlewares.(@= router @)-basicauth.basicauth.users=(@= http_auth @)"
      - "traefik.http.middlewares.(@= router @)-basicauth.basicauth.headerField=X-Forwarded-User"
      #@ end

      #@ if enable_oauth2:
      #@ enabled_middlewares.append("traefik-forward-auth@docker")
      #@ enabled_middlewares.append("header-authorization-group-{}@file".format(authorized_group))
      #@ end

      #@ if enable_mtls_auth:
      - "traefik.http.routers.(@= router @).tls.options=step_ca_mTLS@file"
        #@ if len(mtls_authorized_certs):
      - "traefik.http.middlewares.mtlsauth-(@= router @).plugin.certauthz.domains=(@= mtls_authorized_certs @)"
        #@ enabled_middlewares.append("mtlsauth-{}".format(router))
        #@ end
        #@ enabled_middlewares.append("mtls-header@file")
      #@ end

      #! Apply all middlewares (do this at the end!)
      - "traefik.http.routers.(@= router @).middlewares=(@= ','.join(enabled_middlewares) @)"

      #! Homepage (portal):
      #! See https://gethomepage.dev/configs/docker/#automatic-service-discovery
      #@ if homepage_labels_enable:
      - homepage.group=(@= homepage_group_homelable @)
      - homepage.name=(@= homepage_name_homelable @)
      - homepage.icon=(@= homepage_icon_homelable @)
      - homepage.href=https://(@= traefik_host @)
      - homepage.description=(@= homepage_description_homelable or traefik_host @)
      - homepage.showStats=(@= homepage_show_stats_homelable @)
      #@ end
      #@ if homepage_widget_enable and len(homepage_widget_api_key):
      - homepage.widget.type=customapi
      - homepage.widget.url=https://(@= traefik_host @)/api/v1/stats/summary
      - homepage.widget.headers.X-API-Key=(@= homepage_widget_api_key @)
      #@ end
