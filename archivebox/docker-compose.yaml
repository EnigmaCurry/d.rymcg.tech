volumes:
  data:

services:
  archivebox:
    image: ${ARCHIVEBOX_IMAGE}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    environment:
      - TZ=${DEFAULT_TIMEZONE:-Etc/UTC}
      - ALLOWED_HOSTS=*
      - BASE_URL=https://${ARCHIVEBOX_TRAEFIK_HOST}
    volumes:
      - data:/data
    restart: unless-stopped
    ## archivebox server runs supervisord, which restarts a crashed web
    ## server, crawl runner or sonic inside the container, so probe the web
    ## server and require supervisord to report each one RUNNING for 10s:
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:5797/health/ && supervisorctl -c /tmp/archivebox/supervisord.conf status worker_daphne worker_runner worker_sonic | awk '{n++} $$2 != \"RUNNING\" {bad = 1} $$NF ~ /^[0-9]+:[0-9]+:[0-9]+$$/ && $$0 !~ /day/ {split($$NF, t, \":\"); if (t[1] * 3600 + t[2] * 60 + t[3] < 10) bad = 1} END {exit bad || n != 3}'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    labels: []

  # Note (0.9.x): the Sonic full-text search backend is now built into the
  # archivebox/archivebox image (SEARCH_BACKEND_ENGINE=sonic by default), so
  # no separate sonic service is needed.


  ### Optional Addons: tweak these examples as needed for your specific use case

  # Note (0.9.x): scheduled imports are now database-backed and are processed
  # by the main archivebox server's crawl runner while it runs - no separate
  # scheduler container or cron job is needed. Add schedules with:
  #   make schedule-add
  # or:
  #   docker compose exec archivebox su -c "archivebox schedule --add --every=day --depth=1 'https://example.com/feed'" archivebox

  # Example: run all your ArchiveBox traffic through a WireGuard VPN tunnel
  # wireguard:
  #   image: linuxserver/wireguard
  #   network_mode: 'service:archivebox'
  #   cap_add:
  #   - NET_ADMIN
  #   - SYS_MODULE
  #   sysctls:
  #   - net.ipv4.conf.all.rp_filter=2
  #   - net.ipv4.conf.all.src_valid_mark=1
  #   volumes:
  #   - /lib/modules:/lib/modules
  #   - ./wireguard.conf:/config/wg0.conf:ro

  # Example: Run PYWB in parallel and auto-import WARCs from ArchiveBox
  # pywb:
  #   image: webrecorder/pywb:latest
  #   entrypoint: /bin/sh 'wb-manager add default /archivebox/archive/*/warc/*.warc.gz; wayback --proxy;'
  #   environment:
  #     - INIT_COLLECTION=archivebox
  #   ports:
  #     - 8080:8080
  #   volumes:
  #     ./data:/archivebox
  #     ./data/wayback:/webarchive
