volumes:
  data:

services:
  archivebox:
    image: ${ARCHIVEBOX_IMAGE}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    environment:
      - ALLOWED_HOSTS=*
      - BASE_URL=https://${ARCHIVEBOX_TRAEFIK_HOST}
    volumes:
      - data:/data
    restart: unless-stopped
    labels: []

  public-api-gateway:
    build:
      context: ${ARCHIVEBOX_API_GATEWAY_CONTEXT:-https://github.com/EnigmaCurry/archivebox-api-gateway.git}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    environment:
      - ARCHIVEBOX_BASE_URL=http://archivebox:5797
      - API_BASE_URL=https://${ARCHIVEBOX_TRAEFIK_HOST}
      - PATH_PREFIX=/api-gateway
      - SECRET_KEY
      - ARCHIVEBOX_USERNAME
      - ARCHIVEBOX_PASSWORD
      - LOG_LEVEL=${API_LOG_LEVEL}
    labels: []



  # Note (0.9.x): the Sonic full-text search backend is now built into the
  # archivebox/archivebox image (SEARCH_BACKEND_ENGINE=sonic by default), so
  # no separate sonic service is needed.


  ### Optional Addons: tweak these examples as needed for your specific use case

  # Note (0.9.x): scheduled imports are now database-backed and are processed
  # by the main archivebox server's crawl runner while it runs - no separate
  # scheduler container or cron job is needed. Add schedules with:
  #   make schedule-add
  # or:
  #   docker compose exec archivebox su -c "archivebox schedule --add --every=day --depth=1 'https://example.com/feed'" archivebox

  # Example: run all your ArchiveBox traffic through a WireGuard VPN tunnel
  # wireguard:
  #   image: linuxserver/wireguard
  #   network_mode: 'service:archivebox'
  #   cap_add:
  #   - NET_ADMIN
  #   - SYS_MODULE
  #   sysctls:
  #   - net.ipv4.conf.all.rp_filter=2
  #   - net.ipv4.conf.all.src_valid_mark=1
  #   volumes:
  #   - /lib/modules:/lib/modules
  #   - ./wireguard.conf:/config/wg0.conf:ro

