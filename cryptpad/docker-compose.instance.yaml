#! ### Standard project vars:
#@ load("@ytt:data", "data")
#@ project = data.values.project
#@ instance = data.values.instance
#@ context = data.values.context
#@ traefik_host = data.values.traefik_host
#@ sandbox_host = data.values.sandbox_host
#@ ip_sourcerange = data.values.ip_sourcerange
#@ enable_http_auth = len(data.values.http_auth.strip()) > 0
#@ http_auth = data.values.http_auth
#@ enable_oauth2 = data.values.oauth2 == "true"
#@ authorized_group = data.values.authorized_group
#@ enable_mtls_auth = data.values.enable_mtls_auth == "true"
#@ mtls_authorized_certs = data.values.mtls_authorized_certs
#@ enabled_middlewares = []
#@ homepage_labels_enable = data.values.homepage_labels_enable == "true"
#@ homepage_group_cryptpad = data.values.homepage_group_cryptpad
#@ homepage_name_cryptpad = data.values.homepage_name_cryptpad
#@ homepage_icon_cryptpad = data.values.homepage_icon_cryptpad
#@ homepage_description_cryptpad = data.values.homepage_description_cryptpad
#@ homepage_show_stats_cryptpad = data.values.homepage_show_stats_cryptpad

#@yaml/text-templated-strings
services:
  cryptpad:
    #@ service = "cryptpad"
    labels:
      - "backup-volume.stop-during-backup=true"
      #! Services must opt-in to be proxied by Traefik:
      - "traefik.enable=true"

      #! 'router' is the fully qualified key in traefik for this router/service: project + instance + service
      #@ router = "{}-{}-{}".format(project,instance,service)
      #@ ws_router = "{}-ws".format(router)

      #! CryptPad serves its 'main' domain and its 'sandbox' domain from the
      #! same port (3000). The server tells them apart using the Host header
      #! and applies the restrictive Content-Security-Policy to the sandbox
      #! domain. Both domains need TLS (a wildcard cert covers both).
      #! No explicit priority: Traefik defaults to the rule's length, which
      #! keeps both routers ahead of the low-priority catch-all error-pages
      #! router on this host.
      - "traefik.http.routers.(@= router @).rule=Host(`(@= traefik_host @)`) || Host(`(@= sandbox_host @)`)"
      - "traefik.http.routers.(@= router @).entrypoints=websecure"
      - "traefik.http.routers.(@= router @).service=(@= router @)"
      - "traefik.http.services.(@= router @).loadbalancer.server.port=3000"

      #! CryptPad's websocket server listens on a separate port (3003).
      #! Following the official nginx example, we forward /cryptpad_websocket
      #! there directly. Its rule is longer than the main router's, so the
      #! default (rule-length) priority makes this router win for that path
      #! prefix on both domains. The parentheses matter: without them,
      #! '&&' binds tighter than '||' and the rule would match EVERY path
      #! on the main domain (sending it all to the websocket-only port):
      - "traefik.http.routers.(@= ws_router @).rule=(Host(`(@= traefik_host @)`) || Host(`(@= sandbox_host @)`)) && PathPrefix(`/cryptpad_websocket`)"
      - "traefik.http.routers.(@= ws_router @).entrypoints=websecure"
      - "traefik.http.routers.(@= ws_router @).service=(@= ws_router @)"
      - "traefik.http.services.(@= ws_router @).loadbalancer.server.port=3003"

      #@ enabled_middlewares.append("{}-ipallowlist".format(router))
      - "traefik.http.middlewares.(@= router @)-ipallowlist.ipallowlist.sourcerange=(@= ip_sourcerange @)"

      #@ if enable_http_auth:
      #@ enabled_middlewares.append("{}-basicauth".format(router))
      - "traefik.http.middlewares.(@= router @)-basicauth.basicauth.users=(@= http_auth @)"
      - "traefik.http.middlewares.(@= router @)-basicauth.basicauth.headerField=X-Forwarded-User"
      #@ end

      #@ if enable_oauth2:
      #@ enabled_middlewares.append("traefik-forward-auth@docker")
      #@ enabled_middlewares.append("header-authorization-group-{}@file".format(authorized_group))
      #@ end

      #@ if enable_mtls_auth:
      - "traefik.http.routers.(@= router @).tls.options=step_ca_mTLS@file"
      - "traefik.http.routers.(@= ws_router @).tls.options=step_ca_mTLS@file"
        #@ if len(mtls_authorized_certs):
      - "traefik.http.middlewares.mtlsauth-(@= router @).plugin.certauthz.domains=(@= mtls_authorized_certs @)"
        #@ enabled_middlewares.append("mtlsauth-{}".format(router))
        #@ end
        #@ enabled_middlewares.append("mtls-header@file")
      #@ end

      #! Apply all middlewares to both routers (do this at the end!)
      - "traefik.http.routers.(@= router @).middlewares=(@= ','.join(enabled_middlewares) @)"
      - "traefik.http.routers.(@= ws_router @).middlewares=(@= ','.join(enabled_middlewares) @)"

      #! Homepage (portal):
      #! See https://gethomepage.dev/configs/docker/#automatic-service-discovery
      #@ if homepage_labels_enable:
      - homepage.group=(@= homepage_group_cryptpad @)
      - homepage.name=(@= homepage_name_cryptpad @)
      - homepage.icon=(@= homepage_icon_cryptpad @)
      - homepage.href=https://(@= traefik_host @)
      - homepage.description=(@= homepage_description_cryptpad or traefik_host @)
      - homepage.showStats=(@= homepage_show_stats_cryptpad @)
      #@ end
