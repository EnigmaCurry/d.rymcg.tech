services:
  mail:
    environment:
      - TZ=${DEFAULT_TIMEZONE:-Etc/UTC}
    image: ${PLAUSIBLE_SMTP_IMAGE}
    restart: unless-stopped

  db:
    image: ${PLAUSIBLE_POSTGRES_IMAGE}
    restart: unless-stopped
    volumes:
      - db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=plausible
      - POSTGRES_PASSWORD=${PLAUSIBLE_POSTGRES_PASSWORD}
      - POSTGRES_USER=plausible
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plausible -d plausible"]
      interval: 10s
      start_period: 1m
    labels:
      - "backup-volume.stop-during-backup=true"

  events_db:
    environment:
      - TZ=${DEFAULT_TIMEZONE:-Etc/UTC}
      - CLICKHOUSE_SKIP_USER_SETUP=1
    build:
      context: clickhouse
      args:
        PLAUSIBLE_CLICKHOUSE_IMAGE: ${PLAUSIBLE_CLICKHOUSE_IMAGE}
    restart: unless-stopped
    volumes:
      - events_db:/var/lib/clickhouse
      - events_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      start_period: 1m
    labels:
      - "backup-volume.stop-during-backup=true"

  app:
    image: ${PLAUSIBLE_IMAGE}
    restart: unless-stopped
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      db:
        condition: service_healthy
      events_db:
        condition: service_healthy
      mail:
        condition: service_started
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - data:/var/lib/plausible
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - TZ=${DEFAULT_TIMEZONE:-Etc/UTC}
      - TMPDIR=/var/lib/plausible/tmp
      - BASE_URL=https://${PLAUSIBLE_TRAEFIK_HOST}
      - SECRET_KEY_BASE=${PLAUSIBLE_SECRET_KEY_BASE}
      - HTTP_PORT=8000
      - DATABASE_URL=postgres://plausible:${PLAUSIBLE_POSTGRES_PASSWORD}@db:5432/plausible
      - CLICKHOUSE_DATABASE_URL=http://events_db:8123/plausible_events_db
      - DISABLE_REGISTRATION=${PLAUSIBLE_DISABLE_REGISTRATION}
      - SMTP_HOST_ADDR=mail
      - SMTP_HOST_PORT=25
    labels:
      - "backup-volume.stop-during-backup=true"
      - "traefik.enable=true"
      - "traefik.http.routers.plausible-${PLAUSIBLE_INSTANCE:-default}.rule=Host(`${PLAUSIBLE_TRAEFIK_HOST}`)"
      - "traefik.http.routers.plausible-${PLAUSIBLE_INSTANCE:-default}.entrypoints=websecure"
      - "traefik.http.services.plausible-${PLAUSIBLE_INSTANCE:-default}.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.plausible-${PLAUSIBLE_INSTANCE:-default}-ipallowlist.ipallowlist.sourcerange=${PLAUSIBLE_IP_SOURCERANGE}"
      - "traefik.http.routers.plausible-${PLAUSIBLE_INSTANCE:-default}.middlewares=plausible-${PLAUSIBLE_INSTANCE:-default}-ipallowlist"

volumes:
  db:
  events_db:
  events_logs:
  data:
