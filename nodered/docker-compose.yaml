
volumes:
  node-red:

services:
  nodered:
    environment:
      - TZ=${DEFAULT_TIMEZONE:-Etc/UTC}
    build:
      context: nodered
      args:
        NODERED_VERSION: ${NODERED_VERSION}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    labels: []
    volumes:
      - node-red:/data
