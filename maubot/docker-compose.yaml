
volumes:
  data:


services:
  ## Generate the config file from the template on every startup:
  config:
    build:
      context: config
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${DEFAULT_TIMEZONE:-Etc/UTC}
      - PRINT_CONFIG
      - MAUBOT_TRAEFIK_HOST
      - MAUBOT_ADMIN_USER
      - MAUBOT_ADMIN_PASSWORD
      - MATRIX_HOMESERVER
    volumes:
      - data:/data
    labels:
      - "backup-volume.stop-during-backup=true"

  maubot:
    environment:
      - TZ=${DEFAULT_TIMEZONE:-Etc/UTC}
    depends_on:
      config:
        condition: service_completed_successfully
    build:
      context: ${MAUBOT_GIT_REPO}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    volumes:
      - data:/data
    labels: []
