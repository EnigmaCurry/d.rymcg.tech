---
# Shaarli - Docker Compose example configuration
#
# See:
# - https://shaarli.readthedocs.io/en/master/Docker/#docker-compose
#
# Environment variables:
# - SHAARLI_TRAEFIK_HOST      Fully Qualified Domain Name for the Shaarli instance
# - SHAARLI_DOCKER_TAG        Shaarli docker tag to use
#                             See: https://hub.docker.com/r/shaarli/shaarli/tags

volumes:
  shaarli-cache:
  shaarli-data:

services:
  shaarli:
    environment:
      - TZ=${DEFAULT_TIMEZONE:-Etc/UTC}
    image: shaarli/shaarli:${SHAARLI_DOCKER_TAG}
    security_opt:
      - no-new-privileges:true
    restart: "unless-stopped"
    volumes:
      - shaarli-cache:/var/www/shaarli/cache
      - shaarli-data:/var/www/shaarli/data
    ## Before setup, / redirects in a loop that needs cookies, so check
    ## only the first response: any 2xx/3xx means php-fpm answered (nginx
    ## returns 502 when it is down):
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:80/ 2>&1 | grep -m1 'HTTP/' | grep -qE ' [23][0-9][0-9] '"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels: []
