volumes:
  tor_data:

services:
  tor:
    build:
      context: tor
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${DEFAULT_TIMEZONE:-Etc/UTC}
      - TOR_HIDDEN_SERVICES=${TOR_HIDDEN_SERVICES}
      - TOR_NGINX_PORT_BASE=${TOR_NGINX_PORT_BASE:-10080}
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - tor_data:/var/lib/tor
    labels: []

  nginx:
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    build:
      context: nginx
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${DEFAULT_TIMEZONE:-Etc/UTC}
      - TOR_HIDDEN_SERVICES=${TOR_HIDDEN_SERVICES}
      - TOR_NGINX_PORT_BASE=${TOR_NGINX_PORT_BASE:-10080}
    labels: []
