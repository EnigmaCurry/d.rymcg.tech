services:
  backup:
    build:
      context: ${BACKUP_VOLUME_GIT_REPO}#${BACKUP_VOLUME_GIT_REF:-master}
    # cap_drop:
    #   - ALL
    security_opt:
      - no-new-privileges:true
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=1024
    restart: unless-stopped
    # All env vars are defined in the template: docker-compose.instance.yaml
    environment:
      - TZ=${BACKUP_TIMEZONE:-${DEFAULT_TIMEZONE:-Etc/UTC}}
    # All labels are defined in the template: docker-compose.instance.yaml
    labels: []
    volumes:
      # The image does not ship tzdata, so mount the host's zoneinfo database
      # for TZ to take effect (and for the cron schedule to honor it):
      - ${HOST_ZONEINFO:-/usr/share/zoneinfo}:/usr/share/zoneinfo:ro
      # All other volumes are defined in the template: docker-compose.instance.yaml
