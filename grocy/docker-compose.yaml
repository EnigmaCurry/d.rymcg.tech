
volumes:
  grocy-data:

services:
  grocy:
    image: lscr.io/linuxserver/grocy:${GROCY_VERSION}
    container_name: grocy
    environment:
      - PUID=${GROCY_UID}
      - GUID=${GROCY_GID}
      - TZ=${GROCY_TZ:-${DEFAULT_TIMEZONE:-Etc/UTC}}
      - CURRENCY=${GROCY_CURRENCY}
      - CULTURE=${GROCY_CULTURE}
    volumes:
      - grocy-data:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Labels are in docker-compose.instance.yaml
    labels: []
