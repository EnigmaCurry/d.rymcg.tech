
services:
  db:
    image: mariadb:${PIWIGO_MARIADB_VERSION}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${PIWIGO_MARIADB_ROOT_PASSWORD}
      ## Run mariadb-upgrade on existing data after a version bump:
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_DATABASE: ${PIWIGO_MARIADB_DATABASE}
      MARIADB_USER: ${PIWIGO_MARIADB_USER}
      MARIADB_PASSWORD: ${PIWIGO_MARIADB_PASSWORD}
    volumes:
      - mariadb:/var/lib/mysql
    labels:
      - "backup-volume.stop-during-backup=true"

  piwigo:
    image: linuxserver/piwigo:${PIWIGO_VERSION}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    volumes:
      - config:/config
      - gallery:/gallery
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${PIWIGO_TIMEZONE:-${DEFAULT_TIMEZONE:-Etc/UTC}}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    # labels are defined in docker-compose.instance.yaml:
    labels: []
volumes:
  config:
  gallery:
  mariadb:
