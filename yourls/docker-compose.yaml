services:
  yourls:
    build:
      context: yourls
      args:
        YOURLS_IMAGE: ${YOURLS_IMAGE}
        YOURLS_PLUGIN_CHANGE_PASSWORD_PACKAGE_DIST: ${YOURLS_PLUGIN_CHANGE_PASSWORD_PACKAGE_DIST}
        YOURLS_PLUGIN_FORCE_LOWERCASE_PACKAGE_DIST: ${YOURLS_PLUGIN_FORCE_LOWERCASE_PACKAGE_DIST}
        YOURLS_PLUGIN_DOWNLOAD_PLUGIN_PACKAGE_DIST: ${YOURLS_PLUGIN_DOWNLOAD_PLUGIN_PACKAGE_DIST}
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      TZ: ${DEFAULT_TIMEZONE:-Etc/UTC}
      YOURLS_DB_PASS: ${MYSQL_ROOT_PASSWORD}
      YOURLS_SITE: https://${YOURLS_TRAEFIK_HOST}
      YOURLS_USER: ${YOURLS_USER}
      YOURLS_PASS: ${YOURLS_PASS}
      YOURLS_UNIQUE_URLS: ${YOURLS_UNIQUE_URLS}
      YOURLS_COOKIEKEY: ${YOURLS_COOKIEKEY}
    labels: []
    healthcheck:
      ## Apache listens on 8080 since yourls 1.10 (80 before):
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/admin/ || curl -fsS -o /dev/null http://localhost/admin/"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - yourls:/var/www/html

  mysql:
    image: ${YOURLS_MYSQL_IMAGE}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: yourls
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql
    labels:
      - "backup-volume.stop-during-backup=true"

      
volumes:
  yourls:
  mysql_data:
